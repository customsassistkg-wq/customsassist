# Codemagic build config for the iOS app (Capacitor WebView wrapper around
# https://customsassist.trade — the origin lives in capacitor.config.json.
# Changing it needs a rebuild and a new store release: a phone only learns the
# new origin by installing an update. The previous origin was switched off on
# 11.09.2026 by the owner's decision, so the version in the stores before 1.1
# cannot load at all until its user updates).
#
# This file alone does NOT make builds work — it still needs one-time setup
# in the Codemagic web UI, done by whoever owns the Apple Developer account:
#   1. Connect this git repo to a Codemagic app.
#   2. Codemagic → Team settings → Integrations → App Store Connect: add an
#      API key generated at appstoreconnect.apple.com (Users and Access →
#      Keys), name the integration exactly "appstore" (or update `auth:`
#      below to match whatever name is chosen).
#   3. In App Store Connect, create the app record with bundle id
#      kg.tnved.checker (must match capacitor.config.json / ios/App project).
#   4. Codemagic can then auto-manage signing certificates/profiles via the
#      API key — no manual certificate wrangling needed.
# Until that setup is done, this workflow will fail at the signing step;
# everything before that (npm install, pod install, web asset sync) will
# still run and can be used to catch build breakage early.

workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "mobile/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          cd mobile
          npm install
      - name: Sync Capacitor web assets into iOS project
        script: |
          cd mobile
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd mobile/ios/App
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Android. Отдельный workflow, потому что ему нужна машина с Android SDK, а не
  # mac_mini, и совсем другой набор секретов.
  #
  # Разовая настройка в веб-интерфейсе Codemagic:
  #   1. Teams → Code signing identities → Android keystores: загрузить
  #      customsassist-upload.jks (лежит вне репозитория, см. RELEASE.md),
  #      указать пароль и алиас customsassist, дать ссылке имя ровно
  #      "customsassist_upload" — иначе поправьте android_signing ниже.
  #   2. Для автозагрузки в Play: Teams → Integrations → Google Play, ключ
  #      сервисного аккаунта из Play Console (Setup → API access).
  #
  # Пока замена upload key в Play Console не подтверждена Google, публикацию
  # держим выключенной: бандл подписан НОВЫМ ключом, и Play отклонит его.
  android-capacitor:
    name: Android Capacitor Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - customsassist_upload
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          cd mobile
          npm install
      - name: Sync Capacitor web assets into Android project
        script: |
          cd mobile
          npx cap sync android
      - name: Build release bundle
        script: |
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/**/*.aab
      - mobile/android/app/build/outputs/**/mapping.txt
    publishing:
      # Включить после подтверждения замены upload key (см. RELEASE.md).
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      email:
        recipients:
          - tshalabaev@gmail.com
