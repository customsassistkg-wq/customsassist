# customsassist.trade — основной домен проекта.

# Запросы к API с одного адреса. Порог с запасом на офис, где за одним внешним адресом
# работают несколько человек; перебор базы одним пользователем ограничивает сам
# /api/engine — по числу разных товарных позиций за сутки (routes/engine.js).
limit_req_zone $binary_remote_addr zone=tnved_api:10m rate=30r/s;

# Канонический адрес: сам сайт.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name customsassist.trade;

    ssl_certificate /etc/letsencrypt/live/customsassist.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customsassist.trade/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Версия nginx в заголовке Server и на страницах ошибок — подсказка для подбора уязвимостей.
    server_tokens off;

    # HSTS: сайт работает только по HTTPS (cookie сессии secure), поэтому новой
    # точки отказа заголовок не добавляет, а подмену на HTTP в чужой сети закрывает.
    # Без includeSubDomains: ts.customsassist.trade — другой сервер и другой проект.
    # add_header не наследуется в location со своим add_header, поэтому ниже в
    # location нет ни одного add_header: Cache-Control там ставит expires.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Страницу нельзя встроить в чужой сайт (кликджекинг), браузер не угадывает тип файла,
    # ссылка наружу уносит только адрес сайта, без ?reset=/?verify= и пути.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Скрипты — только свои (checker.js приходит как blob: из /api/checker.js) и виджет
    # Turnstile; сеть — только свой API. 'unsafe-inline' нужен разметке с onclick и style;
    # защиту от внедрения даёт esc() при выводе, а политика не даёт внедрённому
    # подгрузить чужой скрипт или отправить данные на чужой адрес через fetch.
    # Проверяется в tests/checker-access.test.js: тест берёт политику из этого файла.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    root /opt/tnved;
    index tnved_checker.html;
    client_max_body_size 1m;
    # application/json — ответы /api/engine: карточки по коду приходят разметкой до 150 КБ.
    gzip_types application/javascript application/json;
    gzip_comp_level 5;
    gzip_vary on;

    # .webmanifest нет в mime.types, и nginx отдавал его как
    # application/octet-stream — Chrome такой манифест игнорирует и установка
    # на домашний экран не предлагается. Правим точечно: общий mime.types
    # перезаписывается при обновлении пакета, а location переживёт.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # pdf.js для PDF-вложений в чате помощника (vendor/ в репозитории). Путь с версией — файлы
    # не меняются, кэш на год. .mjs нет в mime.types, а модульный скрипт другого типа браузер
    # не исполнит — ни сам модуль, ни его воркер. expires, а не add_header: иначе заголовки
    # безопасности уровня server здесь бы пропали.
    location ^~ /vendor/ {
        types {
            application/javascript js mjs;
            application/octet-stream bcmap;
        }
        default_type text/plain;
        expires 1y;
    }

    # Backend sources and the authenticated checker bundle are never static assets.
    location ^~ /server/ {
        return 404;
    }
    location ^~ /backups/ {
        return 404;
    }

    # expires epoch — это «Cache-Control: no-cache» без add_header, поэтому заголовки
    # безопасности уровня server здесь действуют.
    location = /tnved_checker.html {
        expires epoch;
    }

    location = / {
        expires epoch;
        try_files /tnved_checker.html =404;
    }

    location / {
        try_files $uri /tnved_checker.html;
    }

    # AI-помощник: вопрос — это несколько вызовов модели подряд (поиск в базе,
    # затем ответ), и минуты по умолчанию на это не хватает.
    location = /api/assistant {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Шаги работы модели идут построчно — буферизация задержала бы их до конца ответа.
        proxy_buffering off;
        # Фото инвойсов: до 4 изображений в base64 в одном запросе.
        client_max_body_size 16m;
    }

    location /api/ {
        limit_req zone=tnved_api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www уводится на апекс: один канонический адрес, одна cookie сессии.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.customsassist.trade;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/customsassist.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customsassist.trade/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://customsassist.trade$request_uri;
}

# HTTP по обоим именам — на HTTPS апекса.
server {
    listen 80;
    listen [::]:80;
    server_name customsassist.trade www.customsassist.trade;
    server_tokens off;
    return 301 https://customsassist.trade$request_uri;
}
